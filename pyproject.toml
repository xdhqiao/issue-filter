[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model_stack: uses local tiny random weights to test the installed Transformers stack",
  "real_model: opt-in test requiring the actual locally downloaded NLI checkpoint",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
